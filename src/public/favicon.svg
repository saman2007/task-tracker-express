<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- مربع پس‌زمینه: fill = رنگ برند، stroke = بوردر مشکی -->
  <rect x="4" y="4" width="56" height="56" rx="14"
        fill="#FFCC00" stroke="#171717" stroke-width="5"/>

  <!-- آیکون برق: اگه شکل دیگه‌ای خواستی، فقط این path رو عوض کن -->
  <path d="M36 10 L17 36 h11 l-4 18 L47 27 H34 z" fill="#171717"/>

  <!-- اگه به‌جای برق، «حرف» خواستی: خط بالا رو حذف و این رو فعال کن:
  <text x="32" y="43" font-size="30" font-weight="900"
        text-anchor="middle" fill="#171717"
        font-family="Arial, sans-serif">T</text>
  -->
</svg>